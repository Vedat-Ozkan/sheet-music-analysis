name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2
      - run: uv sync --frozen --group server --group dev
      - uses: actions/cache@v4
        id: audiveris
        with:
          path: audiveris
          key: audiveris-5.11.0-sma.8
      - if: steps.audiveris.outputs.cache-hit != 'true'
        run: |
          curl -fL -o /tmp/audiveris.deb https://github.com/Audiveris/audiveris/releases/download/5.11.0/Audiveris-5.11.0-ubuntu24.04-x86_64.deb
          echo "f20113aaa33b3149ec8d6a09b2a7963360e65fafd92d69389987a85bbc3ec7a3  /tmp/audiveris.deb" | sha256sum -c
          dpkg-deb -x /tmp/audiveris.deb audiveris
          curl -fL -o audiveris/opt/audiveris/lib/app/audiveris.jar https://github.com/Vedat-Ozkan/audiveris/releases/download/5.11.0-sma.8/audiveris.jar
          echo "a4f49dd5e80fcceda4eb1f1064d310e585d4529366090e576b1f736e04d70951  audiveris/opt/audiveris/lib/app/audiveris.jar" | sha256sum -c
          mkdir audiveris/opt/audiveris/tessdata
          curl -fL -o audiveris/opt/audiveris/tessdata/eng.traineddata https://github.com/tesseract-ocr/tessdata/raw/ced78752cc61322fb554c280d13360b35b8684e4/eng.traineddata
          echo "daa0c97d651c19fba3b25e81317cd697e9908c8208090c94c3905381c23fc047  audiveris/opt/audiveris/tessdata/eng.traineddata" | sha256sum -c
      - run: .venv/bin/python -m pytest -q -rs -n auto
        env:
          AUDIVERIS: ${{ github.workspace }}/audiveris/opt/audiveris/bin/Audiveris
