name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2
      - run: uv sync --frozen --group server --group dev
      - uses: actions/cache@v4
        id: model
        with:
          path: |
            .venv-agnn
            vendor/analysisgnn
            artifacts/models/model.ckpt
          key: analysisgnn-${{ hashFiles('server/requirements-agnn.txt') }}-e115182
      - if: steps.model.outputs.cache-hit != 'true'
        run: |
          uv venv .venv-agnn --python 3.11
          VIRTUAL_ENV=.venv-agnn uv pip install -r server/requirements-agnn.txt \
            --index-url https://pypi.org/simple \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --find-links https://data.pyg.org/whl/torch-2.5.0+cpu.html \
            --index-strategy unsafe-best-match
          VIRTUAL_ENV=.venv-agnn uv pip install setuptools wheel
          VIRTUAL_ENV=.venv-agnn uv pip install --no-deps --no-build-isolation \
            "git+https://github.com/manoskary/graphmuse.git@acd464f0cf11c65bda38f0d32a31e078f7941d78"
          git clone https://github.com/manoskary/analysisgnn vendor/analysisgnn
          git -C vendor/analysisgnn checkout e115182fb29b74bdcb6bf3547ed427d967580947
          VIRTUAL_ENV=.venv-agnn uv pip install --no-deps vendor/analysisgnn
          mkdir -p artifacts/models
          curl -fL -o artifacts/models/model.ckpt https://huggingface.co/spaces/manoskary/analysisgnn/resolve/main/checkpoint/model.ckpt
          echo "53d106038fea6a5ab3d4c0a19617736dff5f0299deffaf240ebd484c11f91c67  artifacts/models/model.ckpt" | sha256sum -c
      - uses: actions/cache@v4
        id: audiveris
        with:
          path: audiveris
          key: audiveris-5.11.0-sma.3
      - if: steps.audiveris.outputs.cache-hit != 'true'
        run: |
          curl -fL -o /tmp/audiveris.deb https://github.com/Audiveris/audiveris/releases/download/5.11.0/Audiveris-5.11.0-ubuntu24.04-x86_64.deb
          echo "f20113aaa33b3149ec8d6a09b2a7963360e65fafd92d69389987a85bbc3ec7a3  /tmp/audiveris.deb" | sha256sum -c
          dpkg-deb -x /tmp/audiveris.deb audiveris
          curl -fL -o audiveris/opt/audiveris/lib/app/audiveris.jar https://github.com/Vedat-Ozkan/audiveris/releases/download/5.11.0-sma.3/audiveris.jar
          echo "af257f23a32e5e86acde4ec604b733e3a52d113516302db191cbb7a06103dff7  audiveris/opt/audiveris/lib/app/audiveris.jar" | sha256sum -c
          mkdir audiveris/opt/audiveris/tessdata
          curl -fL -o audiveris/opt/audiveris/tessdata/eng.traineddata https://github.com/tesseract-ocr/tessdata/raw/ced78752cc61322fb554c280d13360b35b8684e4/eng.traineddata
          echo "daa0c97d651c19fba3b25e81317cd697e9908c8208090c94c3905381c23fc047  audiveris/opt/audiveris/tessdata/eng.traineddata" | sha256sum -c
      - run: .venv/bin/python -m pytest -q -rs -n auto
        env:
          GIT_PYTHON_REFRESH: quiet
          AUDIVERIS: ${{ github.workspace }}/audiveris/opt/audiveris/bin/Audiveris
