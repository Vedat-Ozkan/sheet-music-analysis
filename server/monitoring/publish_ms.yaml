description: Milliseconds per tool call spent in timings_ms.publish
filter: resource.type="cloud_run_revision" AND jsonPayload.tool:* AND jsonPayload.timings_ms.publish:*
valueExtractor: EXTRACT(jsonPayload.timings_ms.publish)
labelExtractors:
  tool: EXTRACT(jsonPayload.tool)
  cold: EXTRACT(jsonPayload.cold)
bucketOptions:
  exponentialBuckets:
    numFiniteBuckets: 40
    growthFactor: 1.4
    scale: 1
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: ms
  labels:
  - key: tool
  - key: cold
