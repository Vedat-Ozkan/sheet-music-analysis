description: One per request held open 250 s or more, close to Cloud Run's 300 s timeout
filter: resource.type="cloud_run_revision" AND httpRequest.latency>="250s"
labelExtractors:
  method: EXTRACT(httpRequest.requestMethod)
  user_agent: EXTRACT(httpRequest.userAgent)
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  labels:
  - key: method
  - key: user_agent
