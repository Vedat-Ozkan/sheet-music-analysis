<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #fff; color: #111; }
  img { display: block; width: 100%; height: auto; }
  #title { margin: 0; padding: 12px 12px 4px; font-size: 15px; font-weight: 600; }
  #title:empty { display: none; }
  .actions { display: flex; flex-direction: column; gap: 4px; padding: 12px; }
  .actions button { width: 100%; height: 40px; border: 0; border-radius: 20px; font: inherit; font-size: 15px; cursor: pointer; }
  .actions button[hidden] { display: none; }
  #pdf { background: #0d0d0d; color: #fff; }
  #musicxml { background: none; color: #0d0d0d; }
</style>
</head>
<body>
<h1 id="title"></h1>
<img id="page" alt="Engraved score">
<div class="actions">
  <button id="pdf">Download PDF</button>
  <button id="musicxml" hidden>Download MusicXML</button>
</div>
<script>
  // Minimal MCP Apps view: read-only, shows the rendered page and download buttons.
  let nextId = 1;
  const pending = {};
  let pdfUrl = null;
  let musicxmlUrl = null;

  function send(message) { window.parent.postMessage(message, "*"); }
  function request(method, params) {
    const id = nextId++;
    send({ jsonrpc: "2.0", id, method, params });
    return new Promise((resolve) => { pending[id] = resolve; });
  }
  function reportSize() {
    const root = document.documentElement;
    send({ jsonrpc: "2.0", method: "ui/notifications/size-changed",
           params: { width: root.scrollWidth, height: root.scrollHeight } });
  }
  function show(data) {
    if (!data || !data.image_url) return;
    const image = document.getElementById("page");
    image.onload = reportSize;
    image.src = data.image_url;
    pdfUrl = data.pdf_url;
    musicxmlUrl = data.musicxml_url || null;
    document.getElementById("musicxml").hidden = !musicxmlUrl;
    document.getElementById("title").textContent = data.title || data.caption || "";
  }

  window.addEventListener("message", (event) => {
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;
    if (message.id !== undefined && pending[message.id]) {
      pending[message.id](message.result);
      delete pending[message.id];
    } else if (message.method === "ui/notifications/tool-result") {
      show(message.params && message.params.structuredContent);
    }
  });

  function download(id, url) {
    document.getElementById(id).addEventListener("click", () => {
      const href = url();
      if (!href) return;
      if (window.openai && window.openai.openExternal) window.openai.openExternal({ href });
      else request("ui/open-link", { url: href });
    });
  }
  download("pdf", () => pdfUrl);
  download("musicxml", () => musicxmlUrl);

  reportSize();
  new ResizeObserver(reportSize).observe(document.body);

  const identity = { name: "score-card", version: "0.0.1" };
  request("ui/initialize", { protocolVersion: "2026-01-26", appInfo: identity, clientInfo: identity, appCapabilities: {} })
    .then(() => send({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} }));

  // ChatGPT also exposes the tool result directly.
  if (window.openai && window.openai.toolOutput) show(window.openai.toolOutput);
  window.addEventListener("openai:set_globals", () => show(window.openai && window.openai.toolOutput));
</script>
</body>
</html>
