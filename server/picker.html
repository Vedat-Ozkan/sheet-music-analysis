<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 14px 16px; font: 14px system-ui, sans-serif; background: #fff; color: #111; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  label.button { padding: 8px 14px; border: 1px solid #111; border-radius: 8px; cursor: pointer; font-weight: 600; }
  label.button:hover { background: #f2f2f2; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  #status { color: #444; }
  #status.error { color: #b3261e; }
</style>
</head>
<body>
<div class="row">
  <label class="button">Choose score file<input id="file" type="file" accept=".mxl,.musicxml,.xml"></label>
  <span id="status">MusicXML (.mxl or .musicxml), up to 10 MB</span>
</div>
<script>
  // Minimal MCP Apps view: lets the user hand a score file to the server without leaving the chat.
  const UPLOAD_URL = "__UPLOAD_URL__";
  let nextId = 1;
  const pending = {};

  function send(message) { window.parent.postMessage(message, "*"); }
  function request(method, params) {
    const id = nextId++;
    send({ jsonrpc: "2.0", id, method, params });
    return new Promise((resolve, reject) => { pending[id] = { resolve, reject }; });
  }
  // Measure the content, not the page: the page is never shorter than the frame, so a tall frame would stay tall.
  function reportSize() {
    const height = Math.ceil(document.body.getBoundingClientRect().height);
    if (window.openai && window.openai.notifyIntrinsicHeight) window.openai.notifyIntrinsicHeight(height);
    send({ jsonrpc: "2.0", method: "ui/notifications/size-changed",
           params: { width: document.documentElement.scrollWidth, height } });
  }
  function setStatus(text, isError) {
    const status = document.getElementById("status");
    status.textContent = text;
    status.className = isError ? "error" : "";
    reportSize();
  }

  window.addEventListener("message", (event) => {
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0" || message.id === undefined || !pending[message.id]) return;
    const { resolve, reject } = pending[message.id];
    delete pending[message.id];
    if (message.error) reject(message.error); else resolve(message.result);
  });

  // Let the chat model see which score was chosen without sending a message: the user goes on to say which bars.
  async function remember(text) {
    if (window.openai && window.openai.setWidgetState) {
      window.openai.setWidgetState({ modelContent: text });
      return;
    }
    await request("ui/update-model-context", { content: [{ type: "text", text }] });
  }

  document.getElementById("file").addEventListener("change", async (event) => {
    const file = event.target.files[0];
    if (!file) return;
    setStatus("Sending " + file.name + "…");
    try {
      const response = await fetch(UPLOAD_URL, { method: "POST", body: file });
      const body = await response.json();
      if (!response.ok) throw new Error(body.error || "upload failed");
      await remember('The user chose the score file "' + file.name + '". Its score_id is ' + body.score_id + ".");
      setStatus("Received " + file.name + ". Now say which bars you'd like analysed.");
    } catch (error) {
      setStatus("Could not send the file: " + (error.message || error), true);
    }
  });

  // The host shows nothing until it knows the height, so say it straight away and on every change.
  reportSize();
  window.addEventListener("load", reportSize);
  new ResizeObserver(reportSize).observe(document.body);

  const identity = { name: "score-picker", version: "0.0.1" };
  request("ui/initialize", { protocolVersion: "2026-01-26", appInfo: identity, clientInfo: identity, appCapabilities: {} })
    .catch(() => null)
    .then(() => { send({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} }); reportSize(); });
</script>
</body>
</html>
