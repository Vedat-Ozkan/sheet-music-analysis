[project]
name = "sheet-music-analysis"
version = "0.0.1"
description = "Harmonic analysis drawn on an engraved score, served over MCP"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Vedat Ozkan" }]
# The installable package is the engine alone (Reflets depends on it); the hosted server's packages are a
# dependency group, which is not part of the published package.
dependencies = [
    "music21>=10.5",
    "verovio>=6.3",
    "resvg-py>=0.5",
    "pillow>=11",
    "fonttools>=4.50",
    "pydantic>=2.8",
]

[project.optional-dependencies]
pdf = ["cairosvg>=2.7", "pikepdf>=9"]  # engine/render.py PDF output, engine/read_pdf.py

[dependency-groups]
dev = ["pytest>=8", "pypdf>=5"]  # pypdf: eval/judge.py reads published analyses
server = [
    "mcp>=2.2",
    "httpx>=0.28",
    "uvicorn>=0.30",
    "python-multipart>=0.0.20",
    "google-cloud-storage>=3.16.0",
    "cairosvg>=2.7",
    "pikepdf>=9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
exclude = ["**/.uuid"]

[tool.uv]
default-groups = ["dev", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
