<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fonts for the vector PDF (cairo finds fonts through fontconfig): only the ones the PNG uses,
     with Verovio's "Times, serif" mapped to Score Serif, which has Times metrics. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <alias binding="same"><family>Times</family><prefer><family>Score Serif</family></prefer></alias>
  <alias binding="same"><family>Times, serif</family><prefer><family>Score Serif</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>Score Serif</family><family>DejaVu Serif</family></prefer></alias>
</fontconfig>
