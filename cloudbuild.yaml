# Used by server/deploy.sh. Kaniko keeps every layer in a cache next to the image, so a change to engine/ or
# server/ rebuilds only the last copies instead of reinstalling PyTorch and downloading the weights (6 min).
steps:
  - name: gcr.io/kaniko-project/executor:v1.23.2
    args: ["--destination=${_IMAGE}", "--cache=true", "--cache-ttl=720h"]
substitutions:
  _IMAGE: ""
timeout: 2400s
