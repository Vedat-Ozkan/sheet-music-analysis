# Used by server/deploy.sh for both images: the base (Dockerfile.base) and the server on top of it (Dockerfile).
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "${_DOCKERFILE}", "--build-arg", "BASE=${_BASE}", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
substitutions:
  _DOCKERFILE: Dockerfile
  _BASE: ""
  _IMAGE: ""
timeout: 2400s
